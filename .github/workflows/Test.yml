name: OrangeFox Build - AVB + Wipe + Data
on:
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        default: 'm14x'
      DEVICE_TREE:
        default: 'https://github.com/nepnttt/NTandroid_device_samsung_m14x.git'
      BRANCH:
        default: 'android-12.1'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Clean & Setup
      run: |
        rm -rf out/ .repo/ OrangeFox/
        sudo apt update && sudo apt install aria2 git repo python3 -y
        
    - name: 32GB Swap
      uses: pierotofy/set-swap-space@master
      with: swap-size-gb: 32
    
    - name: OrangeFox Source + FLAGS
      run: |
        mkdir OrangeFox && cd OrangeFox
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync && ./orangefox_sync.sh --branch 12.1 --path ../OrangeFox/fox_12.1 --force-sync -j4
        
        # ✅ ADD ALL FLAGS
        cd ../fox_12.1
        cat > device/samsung/m14x/OrangeFox-Recovery-Flags.mk << 'EOF'
        # AVB ALL VERSIONS + VBMETA
        OF_PATCH_AVB20 := 1
        FOX_AVB_ALL_VERSIONS := 1
        FOX_VBMETA_PATCH := 1
        FOX_VBMETA_DISABLE := 1
        
        # SYSTEM WIPE + ro2rw
        FOX_RO2RW_SUPPORT := 1
        FOX_ENABLE_SYSTEM_WIPE_POST_RO2RW := 1
        FOX_WIPE_SYSTEM_ONLY := 1
        OF_SUPPORT_RO2RW := 1
        
        # FULL DATA BACKUP
        FOX_BACKUP_DATA := 1
        FOX_ENABLE_QUICK_BACKUP := 1
        OF_QUICK_BACKUP_LIST := "/data;/system;/boot;/vendor;"
        FOX_DATA_BACKUP_ADVANCED := 1
        
        # KERNEL + TOOLS
        FOX_USE_KERNEL_EXTRACTOR := 1
        FOX_KERNEL_FLASH_SUPPORT := 1
        FOX_ANYKERNEL3_SUPPORT := 1
        
        # VENDOR PROP AVB DISABLE
        FOX_VENDOR_PROP_AVB_DISABLE := 1
        OF_VENDOR_AVB_DISABLED := 1
        EOF
        
        # ✅ FSTAB with flags
        cat > device/samsung/m14x/recovery.fstab << 'EOF'
        /boot           emmc    /dev/block/by-name/boot                           flags=display,kernel_backup
        /system         ext4    /dev/block/by-name/system                         flags=display,wipe,ro2rw,system_wipe
        /vendor         ext4    /dev/block/by-name/vendor                         flags=display,wipe,backup,avb_vendor_disable
        /data           f2fs    /dev/block/by-name/userdata                       flags=backup,wipe,data,full_backup
        /super          raw     /dev/block/by-name/super                          flags=display,backup
        EOF
        
        # ✅ BoardConfig
        cat > device/samsung/m14x/BoardConfig.mk << 'EOF'
        TARGET_RECOVERY_FSTAB := device/samsung/m14x/recovery.fstab
